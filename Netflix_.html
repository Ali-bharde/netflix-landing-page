
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between; /* logo left, button right */
      padding: 18px 40px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    }

    nav h1 {
      color: #e50914;
      font-size: 52px;
      letter-spacing: -1px;
    }

    .sign-in-btn {
      padding: 8px 20px;
      background: #e50914;
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sign-in-btn:hover {
      background: #f6121d;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;           /* dimmed for contrast */
      z-index: 0;
    }

    /* dark overlay on top of image */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* ── TEXT BLOCK ── */
    .text {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: white;           /* fixed: was black */
      padding: 0 20px;
    }

    .text h2 {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.2;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    .text h3 {
      font-size: 20px;
      font-weight: 400;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
    }

    /* ── EMAIL BOX ── */
    .email-box {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .email-box input {
      padding: 15px 20px;
      font-size: 16px;
      width: 340px;
      border: 1px solid rgba(255,255,255,0.5); /* fixed: was missing 'solid' */
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.6);         /* dark transparent bg */
      color: white;
      outline: none;
      transition: border 0.2s;
    }

    .email-box input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .email-box input:focus {
      border-color: white;
    }

    .email-box button {
      padding: 15px 28px;
      background: #e50914;
      color: white;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .email-box button:hover {
      background: #f6121d;
      transform: scale(1.02);
    }

    /* ── DIVIDER ── */
    .divider {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #333;
      z-index: 2;
    }
  </style>
</head>
<body>

  <nav>
    <h1>NETFLIX</h1>
    <button class="sign-in-btn">Sign In</button>
  </nav>

  <div class="hero">
    <!-- Replace src with your actual image path -->
    <img src="wp1945909.jpg" 
         class="bg-img" 
         alt="Netflix background – movies and shows collage">

    <div class="text">
      <h2>Unlimited movies,<br>shows, and more</h2>
      <h3>Starts at ₹149. Cancel at any time.</h3>  <!-- fixed typo + INR -->
      <div class="email-box">
        <input type="email" placeholder="Email address">
        <button>Get Started &rsaquo;</button>
      </div>
    </div>

    <div class="divider"></div>
  </div>

</body>
</html>
